name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Verify lockfile and install dependencies
        run: |
          uv lock --check
          uv sync --locked --dev

      - name: Run Python tests
        run: uv run pytest

      - name: Run Python static checks
        run: |
          uv run ruff check .
          uv run python -m compileall -q agent_bridge tests

      - name: Check browser JavaScript syntax
        run: node --check agent_bridge/web/app.js

      - name: Validate bundled Pi extension
        run: |
          npm exec --yes --package=@biomejs/biome@2.3.5 -- biome check integrations/pi/agent-bridge.ts
          task_tsc=$(npm exec --yes --package=typescript@5.9.3 --package=@types/node@24.12.4 --package=@earendil-works/pi-coding-agent@0.78.0 -- which tsc)
          task_node_modules=$(dirname "$(dirname "$task_tsc")")
          "$task_tsc" --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --types node --typeRoots "$task_node_modules/@types" --baseUrl "$task_node_modules" integrations/pi/agent-bridge.ts

      - name: Check patch whitespace
        run: git diff --check
