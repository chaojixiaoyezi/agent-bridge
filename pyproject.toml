[project]
name = "agent-bridge"
version = "0.43.2"
description = "Durable multi-agent rooms with chat, structured tasks, and resident execution"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]",
    "python-multipart>=0.0.22,<1",
    "starlette>=1.0,<2",
    "uvicorn>=0.40,<1",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "playwright>=1.55,<2",
    "pytest>=8.3",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "browser: real Chromium end-to-end coverage (requires AGENT_BRIDGE_RUN_BROWSER_TESTS=1)",
    "live_codex: isolated real Codex and Agent Bridge end-to-end coverage (requires AGENT_BRIDGE_RUN_LIVE_CODEX_TESTS=1)",
]
