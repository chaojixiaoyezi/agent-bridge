[project]
name = "agent-bridge"
version = "0.22.0"
description = "Durable multi-agent rooms with chat, structured tasks, and resident execution"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]",
    "starlette>=1.0,<2",
    "uvicorn>=0.40,<1",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
